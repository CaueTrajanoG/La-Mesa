<div class="bg-white rounded-2xl shadow-lg p-6 border-2 border-amber-200 flex flex-col justify-between">

  <div>
    <h3 class="text-xl font-bold text-amber-800 mb-2">
      Comanda {{ comanda.numero }}
    </h3>

    <p class="text-amber-700 text-sm mb-4">
      {{ getProdutosTexto() }}
    </p>
  </div>

  <div class="mt-4">
    <div class="flex justify-between items-center mb-4">
      <span class="text-amber-800 font-semibold">Total:</span>
      <span class="text-lg font-bold text-amber-700">
        R$ {{ comanda.total.toFixed(2) }}
      </span>
    </div>

    <div class="flex space-x-2">
      <button
        (click)="editarComanda()"
        class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 rounded-lg transition duration-200"
      >
        Editar
      </button>

      <button
        (click)="abrirPagamento()"
        class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition duration-200"
      >
        Pagar
      </button>
    </div>
  </div>

</div>
